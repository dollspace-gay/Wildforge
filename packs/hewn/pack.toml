name = "Hewn"
description = "Relief maps over the Gemini tiles: authored height + normals, parallax and lit micro-detail"
# Layer on top of Gemini rather than replacing it. Hewn ships companion maps for
# tiles it wants relief on and inherits every albedo it does not repaint.
inherits = "gemini"

# What an interior layer means is the material's business, not the renderer's.
[layers.ice]
depth = 0.13
opacity = "luminance"   # ice is a sheet: dark means thin, not holey
opacity_min = 0.3
opacity_max = 0.75
dim = 0.82
cutoff = 0.0            # never see through ice to the sky

