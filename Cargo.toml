[package]
name = "wildforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
bytemuck = { version = "1.25.1", features = ["derive"] }
glam = { version = "0.33.2", features = ["serde"] }
jacquard-common = { version = "0.12.1", default-features = false, features = ["reqwest-client"] }
# The "dns" feature pulls hickory-resolver, which pins a hickory-proto with an
# open advisory (GHSA-q2qq-hmj6-3wpp) that has no fix on the 0.24 line. It is
# not reachable from a stub client and the feature is load-bearing for handle
# verification — see docs/dependency-advisories.md before changing either.
jacquard-identity = { version = "0.12.1", default-features = false, features = ["dns"] }
jacquard-oauth = { version = "0.12.1", default-features = false, features = ["browser-open", "loopback"] }
noise = "0.9.0"
png = "0.18.1"
pollster = "1.0.1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
quinn = "0.11"
rcgen = "0.13"
ring = "0.17.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rhai = "1.25.1"
rodio = "0.19"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
smol_str = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
toml = "1.1.3"
# Wildforge's supported desktop backends are Vulkan/GLES on Linux and DX12 on
# Windows. Keeping Metal disabled also keeps Apple-only dependencies out of the
# audited graph until macOS is a supported target.
wgpu = { version = "26", default-features = false, features = ["std", "parking_lot", "dx12", "gles", "vulkan", "wgsl"] }
# The no-title Adwaita CSD still provides Wayland borders without pulling the
# font-rendering dependency used only for client-side title text.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }

[dev-dependencies]
# Validate the WGSL shaders at test time (naga runs them at runtime otherwise).
http = "1"
naga = { version = "26", features = ["wgsl-in"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
] }

[profile.dev]
opt-level = 1
# Parallelize codegen across the crate (16 cores). This is the dev/test
# profile only — the shipped binary uses release, so the per-CGU optimization
# cost is not paid by players.
codegen-units = 16

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
