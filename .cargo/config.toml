# Use Cargo's host defaults. Optional local caching can be enabled with
# RUSTC_WRAPPER=sccache on machines where sccache is installed.

[target.x86_64-pc-windows-msvc]
# link.exe is single-threaded by default. /THREADS lets it use all cores for
# the (large, debug-info-heavy) final link of the test binary, which is the
# slowest single step of `cargo test`.
rustflags = ["-C", "link-arg=/THREADS:16"]

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
