[[feature]]
type = "ore"
block = "gems:ruby_ore"
replaces = "base:stone"
vein_size = 4
per_chunk = 2
y_range = [4, 120]

# Finite mod-mineral provinces inherit the planet's actual basement. Declare
# each exact host instead of pretending every continent is generic stone.
# The per-deposit quota is shared by all of these feature variants, so this
# broadens geological compatibility without multiplying the finite reserve.
