# Capability E5 sample: a data-only skill tree. A world started on the
# gems:cozy mode plays with it (cozy sets skills = true). Nodes grant E4
# stat modifiers; XP accrues from the canonical engine sources below and
# decays per source so no single activity grind dominates. A tier-N node
# unlocks after 3 tier-(N-1) nodes are allocated in the same branch.

schema_version = 1

[tree]
max_level = 80
points_per_level = 1
xp_base = 100.0
xp_exponent = 1.5

[[xp_source]]
id = "mine"
base = 6
decay = 0.25

[[xp_source]]
id = "build"
