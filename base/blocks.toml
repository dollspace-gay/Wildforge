# ---- steelworks ----

[[block]]
id = "firebrick"
name = "Firebrick"
# Stone baked around a warden's ember: the only shell that holds a
# bloomery's heat. Its Pattern A heat retention (1) is the baseline a
# whole shell measures itself against.
texture = "@firebrick"
hardness = 7.0
tool = "pickaxe"
requires_tool = true
heat_retention = 1

[[block]]
id = "firebrick_advanced"
name = "Advanced Firebrick"
# Dev/test ring block: hotter than plain firebrick so stat folding has
# something to fold. Proves firebrick-tier substitution changes a
# machine's effective output without a distinct mouth special-case.
texture = "@firebrick"
hardness = 7.0
tool = "pickaxe"
requires_tool = true
heat_retention = 2

[[block]]
id = "casing_porcelain"
name = "Porcelain Casing"
# Slot-module test block (spec Part 1.3): a casing tile whose qualitative
# capability (ceramic) is set by the module catalog, not by the numeric
# heat_retention that fold_stats reads.
texture = "@firebrick"
hardness = 7.0
tool = "pickaxe"
requires_tool = true
heat_retention = 1

[[block]]
id = "casing_soapstone"
name = "Soapstone Casing"
# Slot-module test block (spec Part 1.3): the other casing module, granting
# a distinct qualitative capability (refractory) from porcelain.
texture = "@firebrick"
hardness = 7.0
tool = "pickaxe"
requires_tool = true
heat_retention = 1

