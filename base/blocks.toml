# Pigmented plaster. Lime render carrying one of the ground mineral
# pigments — the same cinnabar and cobalt the glassworks stains with,
# spread on a wall instead of melted into a pane. Strongly saturated and
# near-flat, which is what makes them useful for judging bounced light:
# a room that goes red should have exactly one thing to blame.
