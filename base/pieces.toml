# Add the growth piece to its own pool so a settlement walk can place it.
[[pool]]
id = "haven"
entries = [
  { piece = "haven_hall", weight = 1 },
]

# The settlement assembly (spec 3.4): reuses the watch-platform plaza as its
# tier-1 entry, then grows the hidden `haven_hall` hall when reputation climbs.
[[assembly]]
id = "elder_haven"
biomes = ["plains", "forest", "scrubland", "taiga"]
rarity = 300
entry = "watch_platform"
pools = { path = "haven" }
max_depth = 2
max_pieces = 4
terrain = "none"
settlement = "elder_haven"

[[assembly]]
id = "road_side_camp"
biomes = ["plains", "forest", "scrubland", "taiga"]
rarity = 120
entry = "watch_platform"
pools = { path = "path" }
max_depth = 4
max_pieces = 12
terrain = "none"