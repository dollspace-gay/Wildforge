  { du = 1, dy = 3, dv = 2, block = "base:cracked_masonry" },
  { du = 4, dy = 3, dv = 2, block = "base:cracked_masonry" },
  { du = 1, dy = 3, dv = 3, block = "base:cracked_masonry" },
