]

# A settlement (spec 3.4): all growth tiers are placed at worldgen; pieces
# tagged `settlement_tier > 1` stay hidden until the player's reputation
# (KV `rep_elder_haven`) crosses the tier threshold.
[[settlement]]
id = "elder_haven"
tiers = [
  { tier = 2, threshold = 2 },   # revealed when rep >= 2
  { tier = 3, threshold = 5 },   # revealed when rep >= 5
]

# A tier-2 growth piece: placed at worldgen but hidden (non-colliding,
# unrendered, unbreakable) until the elder_haven settlement reaches tier 2.
[[piece]]
