[[pool]]
id = "path"
entries = [
  { piece = "near_path", weight = 3 },
  { piece = "far_path", weight = 1 },
]

[[assembly]]
id = "road_side_camp"
biomes = ["plains", "forest", "scrubland", "taiga"]
rarity = 120
entry = "watch_platform"
pools = { path = "path" }
max_depth = 4
max_pieces = 12
terrain = "none"