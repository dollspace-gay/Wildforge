# Piece-based procedural structures (spec Part 2.3).
# Pieces reuse the Phase 4 template cell format (offset + block name), so a
# captured region is already a valid piece body; this file author's the base
# content directly.
#
# Connector kinds pair only with the same kind. Pools are weighted lists of
# interchangeable pieces per connector kind. Assemblies are biome/rarity-gated
# walks: the entry piece is placed, then connectors are followed outward.

# A small watch-platform the walk can start from.
[[piece]]
id = "watch_platform"
connectors = [
  { du = 5, dy = 0, dv = 2, kind = "path", facing = "east" },
  { du = 0, dy = 0, dv = 2, kind = "path", facing = "west" },
]
markers = [
  # spec 2.4/2.5 seam: a `spawn:npc:<id>` marker places that NPC here.
  { du = 2, dy = 1, dv = 2, kind = "spawn:npc:base:elder" },
  # ...and a `feature:<id>` marker places a flag-gated sealed block.
  { du = 2, dy = 1, dv = 1, kind = "feature:base:sealed_elder_door" },
]
cells = [
  # floor ring
  { du = 0, dy = 0, dv = 0, block = "base:mossy_cobblestone" },
  { du = 1, dy = 0, dv = 0, block = "base:mossy_cobblestone" },
  { du = 2, dy = 0, dv = 0, block = "base:mossy_cobblestone" },
  { du = 3, dy = 0, dv = 0, block = "base:mossy_cobblestone" },
  { du = 4, dy = 0, dv = 0, block = "base:mossy_cobblestone" },
  { du = 5, dy = 0, dv = 0, block = "base:mossy_cobblestone" },
  { du = 0, dy = 0, dv = 1, block = "base:cobblestone" },
  { du = 5, dy = 0, dv = 1, block = "base:cobblestone" },
  { du = 0, dy = 0, dv = 2, block = "base:cobblestone" },
  { du = 5, dy = 0, dv = 2, block = "base:cobblestone" },
  { du = 0, dy = 0, dv = 3, block = "base:cobblestone" },
  { du = 5, dy = 0, dv = 3, block = "base:cobblestone" },
  { du = 0, dy = 0, dv = 4, block = "base:mossy_cobblestone" },
  { du = 1, dy = 0, dv = 4, block = "base:mossy_cobblestone" },
  { du = 2, dy = 0, dv = 4, block = "base:mossy_cobblestone" },
  { du = 3, dy = 0, dv = 4, block = "base:mossy_cobblestone" },
