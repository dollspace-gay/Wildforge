# Quest definitions (spec Part 3.3). Definitions are data; progress state
# lives in the per-mod KV store. `item`, `set_flag`, and `add_reputation`
# rewards are additive and may all appear together.

[[quest]]
id = "elder_cerium"
title = "A Handful of Shards"
description = "Bring the elder six shards of cerium and hear the elder books."
giver = "elder"
prereq = ""
objectives = [
  { key = "cerium_shards", description = "Mine six cerium shards", count = 6 },
]
rewards = [
  { item = "amethyst_shard", count = 2 },
  { set_flag = "elder_told_tales", flag_value = "true" },
]

# A second round: settle the Haven's honor. Reputation drives the settlement
# growth tiers (spec 3.4): each point raises the elder_haven rep, and passing
# a tier's threshold reveals that tier's hidden structures.
[[quest]]
id = "elder_honor"
title = "Elder Haven's Honor"
description = "Return with a heart of the land to raise Elder Haven's standing."
giver = "elder"
prereq = "elder_cerium"
objectives = [
  { key = "land_hearts", description = "Deliver a heart of the land", count = 1 },
]
rewards = [
  { item = "cerium_shard", count = 1 },
  { add_reputation = "elder_haven", rep_amount = 3 },
]

# The elder teaches the Maker's tablet (spec 3.5): the `learn_recipe` reward
# writes the recipe's default tech key `learned:base:etched_tablet` truthy,
# which unlocks the gated recipe alongside its blueprint requirement.
[[quest]]
id = "elder_maker"
title = "The Hand That Measures"
description = "Calibrate the maker's plate and learn the tablet craft."
giver = "elder"
prereq = "elder_honor"
objectives = [
  { key = "calibration_plate", description = "Calibrate a maker's plate", count = 1 },
]
rewards = [
  { learn_recipe = "base:etched_tablet" },
]
