name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  maintainability:
    name: Maintainability report
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test maintainability analyzer
        run: python3 -m unittest discover -s tools/tests -v
      - name: Check directory guidance
        run: python3 tools/check_folder_guides.py
      - name: Advisory dependency boundary report
        run: python3 tools/check_architecture.py
      - name: Advisory source size and duplication report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python3 tools/check_maintainability.py --base "$BASE_SHA"
          else
            python3 tools/check_maintainability.py
          fi

  quality:
    name: Format and Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Advisory Rust function report
        run: python3 tools/report_rust_functions.py

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo +1.95.0 check --locked --all-targets

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: tests
      - name: Install pinned integration-test content
        run: python3 tools/install_test_mods.py
      - name: Fast and subsystem tests
        run: "cargo test --locked --all-targets -- --skip tests::agent::"

  agent-tests:
    name: Agent integration tests
    runs-on: ubuntu-24.04
    # This includes checkout, native packages, a cold Rust build, and the
    # scenarios themselves. Five minutes cancelled rustc before the tests
    # could even start on an empty runner cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: agent-tests
      - name: QUIC agent scenarios
        run: "cargo test --locked tests::agent:: -- --test-threads=1"

  release:
    name: Release build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: cargo build --locked --release

  advisories:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.96.0"
          command: check advisories
